name: Tag Build and Release

# Tag-triggered CI/release workflow: builds per-OS installers and zipped
# distributables for the Junie Conversation Viewer and publishes a GitHub
# Release. Triggered only by pushing a version tag matching "v*".
on:
  push:
    tags:
      - "v*"

# Allow the workflow to publish GitHub Releases via the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build and Package (${{ matrix.artifact-suffix }})
    runs-on: ${{ matrix.os }}

    # Shared shell + working directory: all run steps execute from the Gradle
    # project root (JunieConversationViewer/), which contains gradlew.
    defaults:
      run:
        shell: bash
        working-directory: JunieConversationViewer

    strategy:
      # Do not cancel the other OS jobs if one fails; makes per-OS packaging
      # failures easier to diagnose and lets healthy platforms still publish.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-suffix: macos
            java-distribution: temurin
            package-task: packageDmg
            installer-path: desktopApp/build/compose/binaries/main/dmg/*.dmg
            installer-ext: dmg
          - os: windows-latest
            artifact-suffix: windows-x64
            java-distribution: temurin
            package-task: packageMsi
            installer-path: desktopApp/build/compose/binaries/main/msi/*.msi
            installer-ext: msi
          - os: windows-11-arm
            artifact-suffix: windows-arm64
            # Temurin ships no Windows aarch64 JDK 21 (adoptium/temurin#271);
            # use the Microsoft Build of OpenJDK for the Windows ARM64 runner.
            java-distribution: microsoft
            package-task: packageMsi
            installer-path: desktopApp/build/compose/binaries/main/msi/*.msi
            installer-ext: msi
          - os: ubuntu-latest
            artifact-suffix: linux-x64
            java-distribution: temurin
            package-task: packageDeb
            installer-path: desktopApp/build/compose/binaries/main/deb/*.deb
            installer-ext: deb
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-arm64
            java-distribution: temurin
            package-task: packageDeb
            installer-path: desktopApp/build/compose/binaries/main/deb/*.deb
            installer-ext: deb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Derive the version tag once from the pushed ref (e.g. "v1.2.0") and make
      # it available both as a step output and as an environment variable so
      # every downstream step (artifact/installer/zip/checksum names and the
      # Release title) uses one consistent, tag-aware value. The leading "v" is
      # intentionally preserved. NOTE: this only names artifacts/Release assets;
      # Gradle `packageVersion` stays "1.0.0" (true tag-driven versioning is
      # deferred, see docs/project_memory.md).
      - name: Derive release tag
        id: tag
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: ${{ matrix.java-distribution }}
          cache: gradle

      - name: Grant execute permission for gradlew (non-Windows)
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Install Linux packaging dependencies (Xvfb + GL)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgles2 libgl1 zip

      # Test gate: run the aggregate test task before any packaging. On Linux
      # a virtual display (Xvfb) is required for Compose Desktop tests.
      - name: Run tests
        run: |
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            xvfb-run ./gradlew test
          else
            ./gradlew test
          fi

      # Package the native installer for this OS. On Linux, run under Xvfb
      # defensively since jpackage/Compose tooling may touch AWT/graphics.
      - name: Package installer
        run: |
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            xvfb-run ./gradlew :desktopApp:${{ matrix.package-task }}
          else
            ./gradlew :desktopApp:${{ matrix.package-task }}
          fi

      - name: Create distributable app image
        run: |
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            xvfb-run ./gradlew :desktopApp:createDistributable
          else
            ./gradlew :desktopApp:createDistributable
          fi

      # Prepare release assets (Linux/macOS): copy/rename the installer and zip
      # the distributable app image using the tag-aware naming scheme.
      - name: Prepare release artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-artifacts
          base="JunieConversationViewer-${TAG}-${{ matrix.artifact-suffix }}"
          cp ${{ matrix.installer-path }} "release-artifacts/${base}.${{ matrix.installer-ext }}"
          cd desktopApp/build/compose/binaries/main/app
          zip -r "$GITHUB_WORKSPACE/JunieConversationViewer/release-artifacts/${base}-distributable.zip" .

      # Prepare release assets (Windows): PowerShell equivalents of the above.
      - name: Prepare release artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $base = "JunieConversationViewer-$env:TAG-${{ matrix.artifact-suffix }}"
          Copy-Item -Path ${{ matrix.installer-path }} -Destination "release-artifacts/$base.${{ matrix.installer-ext }}"
          Compress-Archive -Path desktopApp/build/compose/binaries/main/app/* -DestinationPath "release-artifacts/$base-distributable.zip"

      # Generate a matching .sha256 sidecar for every prepared release asset.
      - name: Generate SHA256 checksums (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd release-artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            for f in *; do
              [ -f "$f" ] || continue
              case "$f" in *.sha256) continue;; esac
              sha256sum "$f" > "$f.sha256"
            done
          else
            for f in *; do
              [ -f "$f" ] || continue
              case "$f" in *.sha256) continue;; esac
              shasum -a 256 "$f" > "$f.sha256"
            done
          fi

      - name: Generate SHA256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path release-artifacts -File |
            Where-Object { $_.Extension -ne '.sha256' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
            }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JunieConversationViewer-${{ matrix.artifact-suffix }}
          path: JunieConversationViewer/release-artifacts/*

      # Publish (or append assets to) the GitHub Release for this tag. Gated to
      # tag refs; hyphenated tags (e.g. v1.0.0-rc1) are marked as prereleases.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JunieConversationViewer ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: JunieConversationViewer/release-artifacts/*
          body: |
            Automated release for tag `${{ steps.tag.outputs.tag }}`.

            Cross-platform Compose Desktop builds are attached for macOS, Windows x64,
            Windows ARM64, Linux x64, and Linux ARM64. Each platform includes a native
            installer (`.dmg` / `.msi` / `.deb`), a zipped runnable distributable app
            image, and a matching SHA256 checksum (`.sha256`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
